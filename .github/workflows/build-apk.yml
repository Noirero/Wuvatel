name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read

jobs:
  build:
    name: Build Wuvatel M2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Wuvatel-M2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Wuvatel-M2-debug.apk
          path: Wuvatel-M2-debug.apk
          if-no-files-found: error
          archive: false
