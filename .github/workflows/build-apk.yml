# M3.1.7 diagnostic build with permanent signing verification
name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read

jobs:
  build:
    name: Build Wuvatel M3.1.7 diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Check permanent signing secret
        id: signing
        shell: bash
        env:
          WUVATEL_DEBUG_KEYSTORE_BASE64: ${{ secrets.WUVATEL_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$WUVATEL_DEBUG_KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::WUVATEL_DEBUG_KEYSTORE_BASE64 is not configured. Refusing to build an APK with a temporary signing key."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Install permanent Wuvatel signing key
        shell: bash
        env:
          WUVATEL_DEBUG_KEYSTORE_BASE64: ${{ secrets.WUVATEL_DEBUG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          SIGNING_FILE="$RUNNER_TEMP/wuvatel-beta.keystore"
          printf '%s' "$WUVATEL_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_FILE"
          keytool -list \
            -keystore "$SIGNING_FILE" \
            -storepass android \
            -alias androiddebugkey \
            > /dev/null
          echo "WUVATEL_SIGNING_STORE_FILE=$SIGNING_FILE" >> "$GITHUB_ENV"

      - name: Build debug APK with explicit signing key
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK uses permanent signing certificate
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          KEYSTORE_SHA256=$(keytool -list -v \
            -keystore "$WUVATEL_SIGNING_STORE_FILE" \
            -storepass android \
            -alias androiddebugkey \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          APK_SHA256=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          if [ -z "$KEYSTORE_SHA256" ] || [ -z "$APK_SHA256" ]; then
            echo "::error::Could not read signing certificate fingerprints."
            exit 1
          fi

          echo "Permanent keystore SHA256: $KEYSTORE_SHA256"
          echo "Built APK certificate SHA256: $APK_SHA256"

          if [ "$KEYSTORE_SHA256" != "$APK_SHA256" ]; then
            echo "::error::APK signing certificate does not match permanent keystore. Refusing to upload."
            exit 1
          fi

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Wuvatel-M3.1.7-diagnostics-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Wuvatel-M3.1.7-diagnostics-debug.apk
          path: Wuvatel-M3.1.7-diagnostics-debug.apk
          if-no-files-found: error
          archive: false
